name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir buildsrc
          unzip -q Feuille-Reponses-APK-GitHub-v3.zip -d buildsrc
          echo "Files extracted:"
          find buildsrc -maxdepth 4 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: buildsrc
        run: |
          gradle assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find buildsrc -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Feuille-Reponses-APK-v3
          path: 'buildsrc/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
